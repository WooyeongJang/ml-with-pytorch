<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>인공지능과 기계학습 | 강의자료</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    :root{--bg-a:#07111f;--bg-b:#0c1729;--bg-c:#13243f;--text:#edf4ff;--muted:#9eb1cc;--accent:#37c8ff;--accent-2:#7c6cff;--good:#63e6be;--warm:#ffcf70}
    body{min-height:100vh;font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;color:var(--text);background:radial-gradient(circle at 18% 12%,rgba(55,200,255,.16),transparent 24%),radial-gradient(circle at 82% 0%,rgba(124,108,255,.18),transparent 26%),linear-gradient(135deg,var(--bg-a),var(--bg-b) 55%,var(--bg-c))}
    .shell{max-width:1220px;margin:0 auto;padding:28px 18px 44px}
    .head{margin-bottom:18px}
    .eyebrow{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;border:1px solid rgba(55,200,255,.28);background:rgba(55,200,255,.10);color:#ccefff;font-size:13px;letter-spacing:.04em;margin-bottom:14px}
    h1{font-size:clamp(30px,5vw,52px);line-height:1.08;letter-spacing:-.04em;margin-bottom:8px}
    .sub{color:var(--muted);line-height:1.7;font-size:14px;max-width:60ch;margin-bottom:16px}
    .quick-links{display:flex;gap:10px;flex-wrap:wrap}
    .btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 16px;border-radius:14px;text-decoration:none;font-weight:800;border:1px solid transparent;transition:transform .15s ease,border-color .15s ease,background .15s ease}
    .btn:hover{transform:translateY(-1px)}
    .btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff}
    .btn.secondary{border-color:rgba(255,255,255,.14);background:rgba(255,255,255,.05);color:var(--text)}
    .week-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-top:18px}
    .week-card{min-height:104px;padding:14px;border-radius:18px;text-decoration:none;color:inherit;border:1px solid rgba(255,255,255,.09);background:rgba(255,255,255,.04);display:flex;flex-direction:column;justify-content:space-between;transition:transform .15s ease,border-color .15s ease,background .15s ease}
    .week-card:hover{transform:translateY(-2px);border-color:rgba(55,200,255,.42);background:rgba(55,200,255,.08)}
    .week-card.active{border-color:rgba(99,230,190,.62);background:linear-gradient(180deg,rgba(99,230,190,.16),rgba(255,255,255,.05));box-shadow:0 12px 30px rgba(0,0,0,.18)}
    .week-card.locked{opacity:.72;cursor:default}
    .week-card.locked:hover{transform:none;border-color:rgba(255,255,255,.09);background:rgba(255,255,255,.04)}
    .week-num{font-size:12px;letter-spacing:.10em;color:#9fc6ff}
    .week-card.active .week-num{color:#b7fff0}
    .week-name{font-size:17px;font-weight:900;line-height:1.25;margin-top:8px}
    .week-status{margin-top:8px;font-size:12px;color:var(--muted)}
    .week-card.active .week-status{color:#d6fff4}
    .legend{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;color:var(--muted);font-size:12px}
    .legend span{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08)}
    .dot{width:8px;height:8px;border-radius:50%;display:inline-block}
    .dot.ready{background:var(--good)}
    .dot.focus{background:var(--warm)}
    .dot.locked{background:#8093b2}
    .footer{margin-top:18px;text-align:center;color:rgba(237,244,255,.55);font-size:12px}
    @media (max-width:1100px){.week-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
    @media (max-width:720px){.shell{padding:18px 12px 32px}.week-grid{grid-template-columns:1fr 1fr}}
    @media (max-width:520px){.week-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div class="shell">
    <div class="head">
      <div class="eyebrow">강의자료 사이트 · 1주차 ~ 15주차</div>
      <h1>인공지능과 기계학습 강의자료</h1>    
    </div>

    <div class="week-grid">
      <a class="week-card active" href="1주차_강의자료/"><div class="week-num">WEEK 01</div><div class="week-name">1주차 강의자료</div></a>
      <a class="week-card active" href="2주차_강의자료/"><div class="week-num">WEEK 02</div><div class="week-name">2주차 강의자료</div></a>
      <a class="week-card active" href="3주차_강의자료/"><div class="week-num">WEEK 03</div><div class="week-name">3주차 강의자료</div></a>
      <a class="week-card active" href="4주차_강의자료/"><div class="week-num">WEEK 04</div><div class="week-name">4주차 강의자료</div></a>
      <a class="week-card active" href="5주차_강의자료/"><div class="week-num">WEEK 05</div><div class="week-name">5주차 강의자료</div></a>
      <a class="week-card active" href="6주차_강의자료/"><div class="week-num">WEEK 06</div><div class="week-name">6주차 강의자료</div></a>
      <div class="week-card locked"><div class="week-num">WEEK 07</div><div class="week-name">준비중</div></div>
      <div class="week-card locked"><div class="week-num">WEEK 08</div><div class="week-name">준비중</div></div>
      <div class="week-card locked"><div class="week-num">WEEK 09</div><div class="week-name">준비중</div></div>
      <div class="week-card locked"><div class="week-num">WEEK 10</div><div class="week-name">준비중</div></div>
      <a class="week-card active" href="11주차_강의자료/"><div class="week-num">WEEK 11</div><div class="week-name">11주차 강의자료</div></a>
      <div class="week-card locked"><div class="week-num">WEEK 12</div><div class="week-name">준비중</div></div>
      <div class="week-card locked"><div class="week-num">WEEK 13</div><div class="week-name">준비중</div></div>
      <div class="week-card locked"><div class="week-num">WEEK 14</div><div class="week-name">준비중</div></div>
      <div class="week-card locked"><div class="week-num">WEEK 15</div><div class="week-name">준비중</div></div>
    </div>

    <div class="footer">WooyeongJang / ml-with-pytorch</div>
  </div>
</body>
</html>
